<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3e8">
<title>동유럽 여행 · 일자별 상세 일정</title>
<style>
:root{--bg:#eee9dc;--paper:#fffdf7;--ink:#20251f;--muted:#687065;--green:#285c39;--green2:#e5f0e6;--line:#d8d8ca;--amber:#9b6500;--amber2:#fff2d5;--blue:#275b79;--blue2:#e8f2f7;--red:#8a3730;--shadow:0 8px 30px rgba(45,50,38,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;line-height:1.5}button,a{font:inherit}.top{position:sticky;top:0;z-index:20;background:rgba(255,253,247,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topin{max-width:980px;margin:auto;padding:14px 18px 10px}.title{display:flex;justify-content:space-between;align-items:end;gap:16px}.title h1{font-size:20px;margin:0}.title p{font-size:12px;color:var(--muted);margin:2px 0 0}.print{border:0;border-radius:9px;background:var(--green);color:white;padding:8px 11px;font-weight:700;cursor:pointer}.tabs{display:flex;gap:7px;overflow:auto;padding-top:12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:7px 11px;color:var(--muted);cursor:pointer}.tab.active{background:var(--green);border-color:var(--green);color:white;font-weight:750}.wrap{max-width:980px;margin:auto;padding:20px 16px 60px}.day{display:none}.day.active{display:block}.hero{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow)}.eyebrow{color:var(--green);font-size:13px;font-weight:800;letter-spacing:.04em}.hero h2{font-size:29px;line-height:1.15;margin:5px 0}.hero .desc{color:var(--muted);font-size:15px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:17px}.metric{background:#f4f4ec;border-radius:10px;padding:10px}.metric b{display:block;font-size:17px}.metric span{font-size:11px;color:var(--muted)}.section{margin-top:17px}.area{display:flex;align-items:center;gap:8px;margin:24px 3px 10px;font-size:16px}.area:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}.timeline{position:relative}.entry{display:grid;grid-template-columns:92px 28px minmax(0,1fr);position:relative}.entry:before{content:"";position:absolute;left:105px;top:25px;bottom:-7px;width:2px;background:#cbd6ca}.entry:last-child:before{display:none}.time{padding:15px 8px 14px 0;text-align:right;font-size:13px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}.dot{width:12px;height:12px;border-radius:50%;background:white;border:3px solid var(--green);margin:20px auto 0;z-index:1}.card{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin:6px 0;box-shadow:0 3px 14px rgba(45,50,38,.04)}.cardtop{display:flex;align-items:start;justify-content:space-between;gap:10px}.place{font-size:16px;font-weight:800}.type{white-space:nowrap;font-size:11px;border-radius:999px;padding:3px 7px;background:#efefe8;color:var(--muted)}.note{font-size:13px;color:#4d554c;margin-top:6px;white-space:pre-line}.map{display:inline-block;color:var(--blue);font-size:12px;font-weight:700;margin-top:8px;text-decoration:none}.travel{margin:3px 0 5px 120px;padding:9px 12px;border-radius:10px;background:var(--blue2);color:var(--blue);font-size:12px;font-weight:750}.travel.walk{background:var(--green2);color:var(--green)}.travel.caution{background:var(--amber2);color:var(--amber)}.travel .label{opacity:.72;margin-right:6px}.warning{border-left:4px solid var(--amber);background:var(--amber2);border-radius:9px;padding:10px 12px;margin-top:9px;color:#664600;font-size:12px}.error{max-width:680px;margin:80px auto;background:white;border-radius:14px;padding:22px;border:1px solid #ddd}.error code{display:block;margin-top:8px;color:var(--red)}
@media(max-width:640px){.title p{display:none}.wrap{padding:14px 10px 40px}.hero{padding:17px 15px}.hero h2{font-size:25px}.summary{grid-template-columns:repeat(2,1fr)}.entry{grid-template-columns:70px 22px minmax(0,1fr)}.entry:before{left:80px}.time{font-size:12px}.card{padding:12px}.travel{margin-left:92px}.place{font-size:15px}}
@media print{body{background:white}.top{display:none}.wrap{max-width:none;padding:0}.day{display:block!important;break-after:page;padding:10mm}.hero,.card{box-shadow:none}.hero{padding:12px}.map{display:none}.area{margin-top:12px}.card{padding:8px 10px;margin:3px 0}.entry{grid-template-columns:82px 24px 1fr}.entry:before{left:93px}.time{padding-top:10px}.dot{margin-top:14px}.note{font-size:11px}.travel{margin-left:106px;padding:5px 9px}.warning{padding:6px 9px}.summary{margin-top:8px}.metric{padding:7px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="title"><div><h1>동유럽 여행 · 일자별 상세 일정</h1><p>그림보다 시간·이동·주의사항을 먼저 보여주는 보기</p></div><button class="print" onclick="print()">PDF / 인쇄</button></div><nav class="tabs" id="tabs" aria-label="날짜 선택"></nav></div></header>
<main class="wrap" id="app"><div class="error">일정 정보를 불러오는 중입니다.</div></main>
<script>
const DAY_RE=/^## Day (\d+) · (\d{4}\.\d{2}\.\d{2}) \((.)\) · (.+)$/;
const ITEM_RE=/^- \*\*(.+?) · (.+?)\*\* \[(.+?)\]$/;
const AREA_RE=/^### (.+)$/;
function minutes(s){const m=s.match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60 + +m[2]:null}
function range(time){const bits=time.match(/(\d{1,2}:\d{2})\s*[–~-]\s*(\d{1,2}:\d{2})/);return bits?{start:minutes(bits[1]),end:minutes(bits[2])}:{start:minutes(time),end:null}}
function durationText(time){const r=range(time);if(r.start==null||r.end==null)return "미정";let n=r.end-r.start;if(n<0)n+=1440;return n>=60?`${Math.floor(n/60)}시간${n%60?` ${n%60}분`:""}`:`${n}분`}
function transport(note){
 const rules=[[/도보[^.·。]*(?:약 )?\d+(?:~\d+)?분|(?:약 )?\d+(?:~\d+)?분[^.·。]*도보/,"🚶 도보","walk"],[/차량[^.·。]*(?:약 )?\d+(?:~\d+)?분|(?:약 )?\d+(?:~\d+)?분[^.·。]*차량/,"🚗 차량",""],[/기차[^.·。]*(?:약 )?\d+시간[^.·。]*|Railjet[^.·。]*약 \d+시간[^.·。]*|ÖBB[^.·。]*/,"🚆 기차",""],[/버스[^.·。]*(?:약 )?\d+(?:~\d+)?분|(?:약 )?\d+(?:~\d+)?분[^.·。]*버스/,"🚌 버스",""],[/Bolt[^.·。]*|택시[^.·。]*/,"🚕 택시 / Bolt",""],[/입국 \d+~\d+분/,"🛂 입국 수속","caution"]];
 for(const [re,label,cls] of rules){const m=note.match(re);if(m)return{label,detail:m[0].replace(/^[. ]+|[. ]+$/g,""),cls}}
 return null;
}
function parse(md){
 const days=[];let day=null,area="일정",item=null;
 for(const raw of md.split(/\r?\n/)){const line=raw.trim();let m;
  if(m=line.match(DAY_RE)){day={no:+m[1],date:m[2],dow:m[3],city:m[4],title:"",items:[]};days.push(day);area="일정";item=null;continue}
  if(!day)continue;
  if(line.startsWith("**")&&line.endsWith("**")&&!line.includes("[")){day.title=line.slice(2,-2);continue}
  if(m=line.match(AREA_RE)){area=m[1];item=null;continue}
  if(m=line.match(ITEM_RE)){item={time:m[1],place:m[2],type:m[3],area,note:"",map:""};day.items.push(item);continue}
  if(item&&line.startsWith("- ")&&!line.includes("[Google Maps]")){item.note+=(item.note?"\n":"")+line.slice(2);continue}
  if(item&&(m=line.match(/\[Google Maps\]\((.+)\)/))){item.map=m[1]}
 }
 return days;
}
function esc(s){return s.replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function travelBetween(item,next){
 const explicit=transport(item.note||"");if(explicit)return`<div class="travel ${explicit.cls}"><span class="label">다음 이동</span>${esc(explicit.label)} · ${esc(explicit.detail)}</div>`;
 if(!next)return"";const a=range(item.time),b=range(next.time);if(a.end!=null&&b.start!=null&&b.start>=a.end){const gap=b.start-a.end;return`<div class="travel caution"><span class="label">이동·완충 시간</span>${gap}분 · 수단은 지도에서 확인</div>`}return"";
}
function stats(day){let first=null,last=null,total=0;for(const x of day.items){const r=range(x.time);if(r.start!=null&&first==null)first=r.start;if(r.end!=null){last=r.end;total+=r.end-r.start}}const fmt=n=>n==null?"미정":`${String(Math.floor(n/60)).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`;return{first:fmt(first),last:fmt(last||range(day.items.at(-1).time).start),count:day.items.length,total:total?`${Math.floor(total/60)}시간 ${total%60}분`:"부분 미정"}}
function render(days){
 const tabs=document.querySelector("#tabs"),app=document.querySelector("#app");tabs.innerHTML=days.map((d,i)=>`<button class="tab ${i?"":"active"}" data-day="${d.no}">Day ${d.no} · ${esc(d.city)}</button>`).join("");
 app.innerHTML=days.map((d,i)=>{const s=stats(d);let area="";const rows=d.items.map((x,j)=>{const areaHead=x.area!==area?(area=x.area,`<h3 class="area">${esc(area)}</h3>`):"";const caution=/확인|예약|마감|닫|취소|운영|혼잡|입장/.test(x.note)?`<div class="warning">확인 필요 · ${esc(x.note)}</div>`:"";return`${areaHead}<div class="entry"><div class="time">${esc(x.time)}</div><div class="dot"></div><article class="card"><div class="cardtop"><div class="place">${esc(x.place)}</div><span class="type">${esc(x.type)}</span></div>${x.note&&!caution?`<div class="note">${esc(x.note)}</div>`:""}${caution}${x.map?`<a class="map" target="_blank" rel="noopener" href="${esc(x.map)}">지도에서 위치 확인 ↗</a>`:""}</article></div>${travelBetween(x,d.items[j+1])}`}).join("");return`<section class="day ${i?"":"active"}" data-day="${d.no}"><header class="hero"><div class="eyebrow">DAY ${d.no} · ${esc(d.date)} (${esc(d.dow)})</div><h2>${esc(d.city)}</h2><div class="desc">${esc(d.title)}</div><div class="summary"><div class="metric"><b>${s.first}</b><span>첫 일정</span></div><div class="metric"><b>${s.last}</b><span>마지막 일정</span></div><div class="metric"><b>${s.count}개</b><span>일정 항목</span></div><div class="metric"><b>${s.total}</b><span>명시된 체류시간</span></div></div></header><div class="section timeline">${rows}</div></section>`}).join("");
 tabs.onclick=e=>{const b=e.target.closest(".tab");if(!b)return;document.querySelectorAll(".tab,.day").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelector(`.day[data-day="${b.dataset.day}"]`).classList.add("active");scrollTo({top:0,behavior:"smooth"})};
}
fetch("itinerary.md").then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.text()}).then(md=>render(parse(md))).catch(err=>{document.querySelector("#app").innerHTML=`<div class="error"><b>일정 파일을 불러오지 못했습니다.</b><p>GitHub Pages나 로컬 웹서버에서 열어주세요.</p><code>${esc(String(err))}</code></div>`});
</script>
</body>
</html>
